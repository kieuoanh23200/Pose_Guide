name: pose_guide
description: "Pose & Camera Guide app built with Enterprise 4-Layer Architecture in Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core & State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.0
  
  # Navigation & DeepLink
  go_router: ^13.0.0
  
  # Network & Data Parsing
  dio: ^5.4.0
  json_annotation: ^4.8.1
  
  # Hardware, Camera & Sensors
  camera: ^0.10.5+9
  sensors_plus: ^5.0.0
  
  # Local Storage & Native Integration
  shared_preferences: ^2.2.2
  pigeon: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/poses/
    - assets/
